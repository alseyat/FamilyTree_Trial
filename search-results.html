<!DOCTYPE html>
<html lang="ar">

<head>
    <link rel="preload" as="image" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج البحث - شجرة أسرة السياط</title>
    <meta name="description" content="نتائج البحث في شجرة أسرة السياط">
    <link rel="icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon_io/favicon-32x32.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi+Ink:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Search Results page overrides ── */
        .header img {
            max-height: 300px;
        }

        .page-title {
            color: var(--color-accent);
            margin-bottom: 8px;
        }

        .query-label {
            text-align: center;
            font-size: 15px;
            color: var(--color-accent);
            margin-bottom: 25px;
        }

        .query-label span {
            font-weight: bold;
            color: var(--color-text);
            background: rgba(139, 115, 85, 0.12);
            padding: 2px 10px;
            border-radius: 6px;
        }

        .results-count {
            text-align: center;
            font-size: 14px;
            color: var(--color-accent);
            margin-bottom: 20px;
        }

        .no-results {
            text-align: center;
            font-size: 18px;
            color: var(--color-accent);
            padding: 40px 0;
        }

        .results-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .results-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.8);
            margin: 10px 0;
            padding: 14px 20px;
            border: 1px solid rgba(139, 115, 85, 0.2);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            font-size: 16px;
        }

        .results-list li:hover {
            background: rgba(255, 255, 255, 0.97);
            border-color: rgba(139, 115, 85, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(139, 115, 85, 0.15);
        }

        .result-number {
            background: var(--color-accent);
            color: var(--color-cream);
            font-weight: bold;
            font-size: 13px;
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .result-name {
            flex: 1;
            font-weight: bold;
            color: var(--color-text);
            line-height: 1.7;
        }

        .result-name mark {
            background: rgba(139, 115, 85, 0.2);
            color: var(--color-text);
            border-radius: 3px;
            padding: 0 2px;
        }

        .result-arrow {
            color: var(--color-accent);
            font-size: 18px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .header img {
                max-height: 180px;
            }

            .results-list li {
                padding: 12px 15px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>


    <div class="content-container">
        <h1 class="page-title">نتائج البحث</h1>
        <div class="query-label" id="query-label"></div>
        <div class="results-count" id="results-count"></div>
        <ul class="results-list" id="results-list"></ul>

        <div class="back-btn-container">
            <a href="tree.html" class="back-btn">العودة إلى شجرة الأسرة</a>
        </div>
    </div>

    <footer class="bottom-footer"></footer>

    <script type="module">
        let data;
        try {
            const module = await import('./alseyat.js');
            data = module.default;
        } catch (e) {
            document.querySelector('.content-container').innerHTML = '<p style="text-align:center;color:#a33;font-size:18px;padding:40px;">تعذّر تحميل البيانات. يرجى تحديث الصفحة.</p>';
            throw e;
        }

        function searchTreeNames(node, query, fullName = "", matches = []) {
            const currentFullName = fullName ? `${node.name} بن ${fullName}` : node.name;
            if (currentFullName.toLowerCase().startsWith(query.toLowerCase())) {
                matches.push(currentFullName);
            }
            if (node.children) {
                node.children.forEach(child => searchTreeNames(child, query, currentFullName, matches));
            }
            return matches;
        }

        function highlightMatch(text, query) {
            if (!query) return text;
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return text;
            return text.slice(0, idx) +
                `<mark>${text.slice(idx, idx + query.length)}</mark>` +
                text.slice(idx + query.length);
        }

        const params = new URLSearchParams(window.location.search);
        const query = params.get('q') || '';

        const queryLabel = document.getElementById('query-label');
        if (query) {
            queryLabel.innerHTML = `نتائج البحث عن: <span>${query}</span>`;
        }

        const results = query ? searchTreeNames(data, query) : [];

        const countEl = document.getElementById('results-count');
        if (results.length === 0 && query) {
            countEl.textContent = '';
            const list = document.getElementById('results-list');
            list.innerHTML = `<div class="no-results">لا توجد نتائج مطابقة لـ "${query}"</div>`;
        } else {
            countEl.textContent = `عدد النتائج: ${results.length}`;

            const list = document.getElementById('results-list');
            results.forEach((fullName, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="result-number">${index + 1}</div>
                    <div class="result-name">${highlightMatch(fullName, query)}</div>
                    <div class="result-arrow">←</div>
                `;
                li.addEventListener('click', () => {
                    window.location.href = `tree.html?focus=${encodeURIComponent(fullName)}`;
                });
                list.appendChild(li);
            });
        }
    </script>
    <script src="particles.js"></script>
    <script src="menu.js"></script>
</body>

</html>
