<!DOCTYPE html>
<html lang="Arabic">

<head>
    <link rel="preload" as="image" href="https://github.com/alseyat/FamilyTree_Trial/blob/main/logo.png?raw=true">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>شجرة أسرة السياط</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/alseyat/FamilyTree/main/favicon_io/favicon.ico" type="image/x-icon">
    <link rel="icon" href="https://raw.githubusercontent.com/alseyat/FamilyTree/main/favicon_io/favicon-32x32.png" type="image/png">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://d3js.org/d3.v6.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top-header">
        <img src="https://github.com/alseyat/FamilyTree_Trial/blob/main/logo.png?raw=true" alt="شعار الشجرة">
    </header>

    <nav class="nav-bar">
        <a href="about.html" id="about-btn">نبذة عن الأسرة</a>
        <button id="view-stats-btn">إحصائيات</button>
        <button id="expand-collapse-btn">طي / تمديد الشجرة</button>
        <button id="zoom-in-btn">تكبير (+)</button>
        <button id="zoom-out-btn">تصغير (-)</button>
        
        <div class="search-wrapper">
            <input type="text" id="search-box" placeholder="بحث عن اسم...">
            <ul id="search-results"></ul>
        </div>
    </nav>

    <div id="tree-container"></div>
    <div id="tooltip"></div>

    <footer class="bottom-footer">
        إعداد وتصميم: م. أنس بن سعود السياط
    </footer>

    <script type="module" src="script.js"></script>
</body>

</html>
