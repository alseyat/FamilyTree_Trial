<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <link rel="preload" as="image" href="logo.png">
    <link rel="preload" as="image" href="verse.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسرة السياط</title>
    <link rel="icon" href="favicon_io/favicon.ico" type="image/x-icon">

    <link rel="icon" href="favicon_io/favicon-32x32.png" type="image/png">

    <link rel="stylesheet" href="style.css">
    <style>
        /* إعدادات التمركز وضمان عدم الاختفاء عند تغيير حجم النافذة */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* يسمح للصفحة بالتمدد إذا كان المحتوى طويلاً */
            margin: 0;
            background-color: #f4efdf;
            text-align: center;
            overflow-y: auto; /* يظهر شريط التمرير فقط إذا دعت الحاجة */
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .intro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        /* الحالة الافتراضية للعناصر (مخفية ومزاحة للأسفل قليلاً) */
        .logo-intro, .verse-img, .enter-btn {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        /* تنسيق الشعار */
        .logo-intro {
            display: block;
            width: 80vw;
            height: auto;
            max-width: 450px;
            height: auto;
        }

        /* تنسيق صورة الآية */
        .verse-img {
                        display: block;

            width: 80vw;
            max-width: 500px;
            height: auto;
        }

        /* تنسيق زر الدخول */
        .enter-btn {
            background-color: #4a3b32;
            color: #f4efdf;
            border: none;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-family: 'Noto Naskh Arabic', serif;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-top: 10px;
        }

        .enter-btn:hover {
            background-color: #5d4a3f;
            transform: scale(1.05);
        }

        /* تشغيل الحركات عند إضافة كلاس loaded بواسطة JavaScript */
        body.loaded .logo-intro {
            opacity: 1;
            transform: translateY(0);
        }

        body.loaded .verse-img {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.8s; /* تبدأ بعد ظهور الشعار قليلاً */
        }

        body.loaded .enter-btn {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 1.8s; /* تظهر في النهاية */
        }
    </style>
</head>
<body>

    <div class="intro-container">
        <img src="logo.png" alt="شعار أسرة السياط" class="logo-intro">

        <img src="verse.png" alt="آية قرآنية" class="verse-img">

        <a href="tree.html" class="enter-btn">دخول</a>
    </div>

    <script>
        // الانتظار حتى يتم تحميل كافة الموارد (الصور والخطوط) تماماً
        window.addEventListener('load', function() {
            // إضافة الكلاس للجسم لبدء الحركات المتتالية بسلاسة
            document.body.classList.add('loaded');
        });
    </script>

</body>
</html>
