<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <link rel="preload" as="image" href="LogoMain.png">
    <link rel="preload" as="image" href="verse.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسرة السياط</title>
    <meta name="description" content="شجرة أسرة السياط — من عشيرة أهل الحجلا من الزقاريط من عبدة من قبيلة شمر الطائية">
    <link rel="icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon_io/favicon-32x32.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi+Ink:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Animated gradient shift for intro page */
        body.intro-page {
            background-size: auto, auto, auto, auto, 200% 200%;
            animation: gradientShift 12s ease infinite;
            background-image:
                var(--noise-bg),
                var(--arabesque-bg),
                radial-gradient(ellipse at center, transparent 50%, rgba(74, 59, 50, 0.08) 100%),
                radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0.5) 0%, transparent 60%),
                linear-gradient(135deg, #f4efdf 0%, #ede5d0 25%, #f4efdf 50%, #f0e8d4 75%, #f4efdf 100%);
            background-attachment: scroll, scroll, fixed, scroll, scroll;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%, 0 0, center, center, 0% 50%; }
            50%  { background-position: 0% 50%, 0 0, center, center, 100% 50%; }
            100% { background-position: 0% 50%, 0 0, center, center, 0% 50%; }
        }

        .intro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 2;
        }

        .logo-intro, .verse-img, .enter-btn {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .logo-intro {
            display: block;
            width: 80vw;
            max-width: 450px;
            height: auto;
            filter: drop-shadow(0 4px 20px rgba(74, 59, 50, 0.15));
        }

        .verse-img {
            display: block;
            width: 80vw;
            max-width: 500px;
            height: auto;
            filter: drop-shadow(0 2px 12px rgba(74, 59, 50, 0.1));
        }

        .enter-btn {
            font-family: var(--font-heading);
            font-weight: 700;
            background: linear-gradient(135deg, #4a3b32, #5d4a3f, #4a3b32);
            background-size: 200% 100%;
            color: var(--color-cream);
            border: none;
            padding: 15px 50px;
            font-size: 1.3rem;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(74, 59, 50, 0.25);
            margin-top: 10px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .enter-btn:hover {
            background-position: 100% 0;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 30px rgba(74, 59, 50, 0.35);
        }

        .enter-btn:hover::before {
            transform: translateX(100%);
        }

        body.loaded .logo-intro {
            opacity: 1;
            transform: translateY(0);
        }

        body.loaded .verse-img {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.5s;
        }

        body.loaded .enter-btn {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 1.0s;
        }
    </style>
</head>

<body class="intro-page">
    <div class="intro-container">
        <img src="LogoMain.png" alt="شعار أسرة السياط" class="logo-intro">
        <img src="verse.png" alt="آية قرآنية" class="verse-img">
        <a href="tree.html" class="enter-btn">دخول</a>
    </div>

    <script src="particles.js"></script>
    <script>
        window.addEventListener('load', function () {
            document.body.classList.add('loaded');
        });

        /* ── Intro-page sparkle particles ──
           Rising golden sparkles that complement the subtle bokeh orbs,
           giving the landing page a warm, inviting atmosphere. */
        (function () {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const SPARKLE_COUNT = 40;
            const canvas = document.createElement('canvas');
            canvas.id = 'sparkle-canvas';
            Object.assign(canvas.style, {
                position: 'fixed', inset: '0', width: '100%', height: '100%',
                pointerEvents: 'none', zIndex: '1', opacity: '0',
                transition: 'opacity 2.5s ease',
            });
            document.body.appendChild(canvas);
            requestAnimationFrame(() => { requestAnimationFrame(() => { canvas.style.opacity = '1'; }); });

            const ctx = canvas.getContext('2d');
            let w, h, sparkles = [], animId;

            function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }

            function createSparkle(startFromBottom) {
                const size = Math.random() * 2.5 + 1;       // 1–3.5px
                const isGold = Math.random() > 0.3;
                return {
                    x: Math.random() * w,
                    y: startFromBottom ? h + Math.random() * 40 : Math.random() * h,
                    r: size,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: -(Math.random() * 0.4 + 0.15),      // drift upward
                    baseAlpha: Math.random() * 0.5 + 0.2,    // 0.2–0.7
                    phase: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.04 + 0.02,
                    // Warm palette: golds, ambers, cream
                    hue: isGold ? Math.random() * 25 + 30 : Math.random() * 15 + 15,
                    sat: isGold ? Math.random() * 30 + 50 : Math.random() * 20 + 20,
                    lit: isGold ? Math.random() * 15 + 60 : Math.random() * 15 + 75,
                    life: 0,
                    maxLife: Math.random() * 600 + 300,       // 300–900 frames
                };
            }

            function init() {
                resize();
                sparkles = [];
                for (let i = 0; i < SPARKLE_COUNT; i++) sparkles.push(createSparkle(false));
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);

                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const s = sparkles[i];
                    s.life++;
                    s.phase += s.twinkleSpeed;

                    // Fade in during first 60 frames, fade out in last 60
                    let lifeFade = 1;
                    if (s.life < 60) lifeFade = s.life / 60;
                    else if (s.life > s.maxLife - 60) lifeFade = (s.maxLife - s.life) / 60;

                    const twinkle = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(s.phase));
                    const alpha = s.baseAlpha * twinkle * lifeFade;

                    if (alpha > 0.01) {
                        // Glowing core
                        const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
                        grad.addColorStop(0, `hsla(${s.hue}, ${s.sat}%, ${s.lit}%, ${alpha})`);
                        grad.addColorStop(0.3, `hsla(${s.hue}, ${s.sat}%, ${s.lit - 10}%, ${alpha * 0.5})`);
                        grad.addColorStop(1, `hsla(${s.hue}, ${s.sat}%, ${s.lit - 15}%, 0)`);
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                        ctx.fillStyle = grad;
                        ctx.fill();

                        // Bright center dot
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${s.hue}, ${Math.min(s.sat + 20, 100)}%, ${Math.min(s.lit + 15, 95)}%, ${alpha * 0.9})`;
                        ctx.fill();
                    }

                    // Gentle sway + upward drift
                    s.x += s.vx + Math.sin(s.phase * 0.5) * 0.15;
                    s.y += s.vy;

                    // Recycle when faded out or off-screen
                    if (s.life >= s.maxLife || s.y < -20) {
                        sparkles[i] = createSparkle(true);
                    }
                }

                animId = requestAnimationFrame(draw);
            }

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) cancelAnimationFrame(animId); else draw();
            });
            window.addEventListener('resize', resize);
            init();
            draw();
        })();
    </script>
</body>

</html>
