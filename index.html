/* 1. الترويسة العلوية (الهيدر) */
/* عدل الترويسة العلوية لتصبح هكذا */
.top-header {
    text-align: center;
    padding: 15px;
    background: rgba(244, 239, 223, 0.85);

    border-bottom: 1px solid rgba(139, 115, 85, 0.3);

    overflow: hidden;
}

/* أضف هذا الكلاس الجديد في أي مكان داخل قسم style */
.top-header.hidden {
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    opacity: 0;
    border-bottom: none;
}

.top-header img {
    max-height: 500px; /* إذا كان لديك صورة شعار يمكنك وضعها هنا */

/* 2. شريط الأدوات الثابت (Nav Bar) */
.nav-bar {

    background: rgba(255, 255, 255, 0.5);

    flex-wrap: wrap; /* للسماح بالتفاف العناصر في شاشات الجوال */
}

.nav-bar button, .nav-bar a, .nav-bar input {
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(139, 115, 85, 0.4);
    color: #4a3b32;

}

.nav-bar button:hover, .nav-bar a:hover {
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 4px 8px rgba(139, 115, 85, 0.15);
    transform: translateY(-2px);
}

/* إعدادات مربع البحث داخل الشريط */

.search-wrapper input {

<body>
    <header class="top-header">
        <img src="https://github.com/alseyat/FamilyTree_Trial/blob/main/logo1.png?raw=true" alt="شعار الشجرة">
    </header>

    <nav class="nav-bar">
        <a href="about.html" id="about-btn">نبذة عن الأسرة</a>
        <button id="view-stats-btn">إحصائيات</button>
        <button id="expand-collapse-btn">طي / تمديد الشجرة</button>
        <button id="zoom-in-btn">تكبير (+)</button>
        <button id="zoom-out-btn">تصغير (-)</button>
        
        <div class="search-wrapper">
            <input type="text" id="search-box" placeholder="بحث عن اسم...">
            <ul id="search-results"></ul>
        </div>
    </nav>

    <div id="tree-container"></div>
    <div id="tooltip"></div>

    <footer class="bottom-footer">
        إعداد وتصميم: م. أنس بن سعود السياط
    </footer>

    <script type="module">

            import data from './alseyat.js';

            const margin = { top: 200, right: 20, bottom: 20, left: 300 }; // Adjusted top margin to 200px for spacing below the button
            let width = 1200, height = 2000;

            let i = 0, duration = 10, delay = 50;
            let firstHighlightDelay = 250, secondHighlightDelay = 800, thirdHighlightDelay = 1200, fourthHighlightDelay = 300;

            let zoomLevel = 1; // Initial zoom level
            let currentAdjustment = 0; // Tracks horizontal layout shifts

const svg = d3.select("#tree-container").append("svg")                .attr("width", width)
                .attr("height", height);

            const svgGroup = svg.append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`); // Initial translation with increased top padding

            const tree = d3.tree().nodeSize([120, 50])
                .separation((a, b) => a.parent === b.parent ? 1 : 1.25);

            let root = d3.hierarchy(data);
            root.x0 = width / 2;
            root.y0 = 0;

            const breakpoint = 768; // Define the breakpoint for mobile view

            function isMobile() {
                return window.innerWidth <= breakpoint;
            }
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;

            let initialVerticalOffset = -180;
            let initialHorizontalOffset = width / 2 + 19;
            let initialHorizontalForMobile = 79;

            // 1. Create the tooltip div and append it to the body
            const tooltip = d3.select("body").append("div")
                .attr("id", "tooltip")
                .style("opacity", 0);

            // 2. Function to calculate the full lineage string (e.g. أنس بن سعود بن...)
            function getFullName(d) {
                let names = [];
                let current = d;
                while (current) {
                    names.push(current.data.name);
                    current = current.parent;
                }
                return names.join(' بن ');
            }

            // Function to reverse children of each node
            function reverseChildren(node) {
                if (node.children) {
                    node.children.reverse();
                    node.children.forEach(reverseChildren);
                }
            }

            // Reverse children order for the root node
            reverseChildren(root);

            collapse(root);

            function collapse(d) {
                if (d.children) {
                    d._children = d.children;
                    d._children.forEach(collapse);
                    d.children = null;

                }
            }

            function expand(d) {
                if (d._children) {
                    d.children = d._children;
                    d.children.forEach(expand);
                    d._children = null;

                }
            }

            function update(source, center = false) {

                const treeData = tree(root);
                const nodes = treeData.descendants();
                const links = treeData.descendants().slice(1);

                nodes.forEach(d => d.y = d.depth * 80);

                // Calculate the minimum x-coordinate to adjust the tree position
                const minX = Math.min(...nodes.map(d => d.x));
                currentAdjustment = Math.max(0, 100 - minX); // Ensure minimum padding of 200

                // Calculate the maximum x-coordinate to adjust the SVG height
                const maxX = Math.max(...nodes.map(d => d.x));
                const newHeight = maxX + 200; // Add padding of 200

                // Adjust the tree position dynamically
                svgGroup.attr("transform", `translate(${currentAdjustment} , 230) scale(${zoomLevel})`);
                // Adjust the SVG height dynamically
                d3.select("svg").attr("height", newHeight);

                const node = svgGroup.selectAll('g.node')
                    .data(nodes, d => d.id || (d.id = ++i));

                const nodeEnter = node.enter().append('g')
                    .attr('class', 'node')
                    .attr('transform', d => {
                        if (isMobile()) {
                            return `translate(${source.x + initialHorizontalForMobile},${source.y0 + initialVerticalOffset})`;
                        } else {
                            return `translate(${source.x + initialHorizontalOffset},${source.y0 + initialVerticalOffset})`;
                        }
                    })
                    .attr('data-id', d => d.id)
                    .on('click', click)


                nodeEnter.append('rect')
                    .attr('width', 100)
                    .attr('height', 40)
                    .attr('x', -50)
                    .attr('y', -15)
                    .attr('rx', 10)
                    .attr('ry', 10)
                    .attr('class', 'node')
                    .style('fill', d => d._children ? "lightsteelblue" : "#fff");

                nodeEnter.append('text')
                    .attr('dy', '.23em')
                    .attr('x', 0)
                    .attr('text-anchor', 'middle')
                    .attr("font-family", 'Noto Naskh Arabic, sans-serif')
                    .attr("font-size", "20px")
                    .text(d => d.data.name);

                // Create a group for the children badge, positioned at the bottom middle (y = 15)
                const badge = nodeEnter.append('g')
                    .attr('class', 'children-badge')
                    .attr('transform', 'translate(0, 24)')
                    .style('display', d => (d.children || d._children) ? null : 'none');

                // Add the circle background
                badge.append('circle')
                    .attr('r', 10)
                    .style('fill', '#ea5050') // Red background
                    .style('stroke', '#fff')  // White border to make it pop
                    .style('stroke-width', '2px');

                // Add the number text inside the circle
                badge.append('text')
                    .attr('dy', '0.35em')
                    .attr('text-anchor', 'middle')
                    .attr('font-family', 'Noto Naskh Arabic, sans-serif')
                    .attr('font-size', '11px')
                    .attr('font-weight', 'bold')
                    .style('fill', '#fff') // White text
                    .text(d => d.children ? d.children.length : (d._children ? d._children.length : ''));

                const nodeUpdate = nodeEnter.merge(node);

                nodeUpdate.transition()
                    .duration(d => d.depth === 0 ? 0 : duration)
                    .attr('transform', d => {
                        if (isMobile()) {
                            // Adjustments for mobile view
                            return `translate(${d.x + initialHorizontalForMobile},${d.y + initialVerticalOffset})`;
                        } else {
                            // Adjustments for desktop view
                            return `translate(${d.x + initialHorizontalOffset},${d.y + initialVerticalOffset})`;

                        }
                    });
                nodeUpdate.select('rect')
                    .attr('width', 100)
                    .attr('height', 40)
                    .attr('x', -50)
                    .attr('y', -20)
                    .attr('rx', 10)
                    .attr('ry', 10)
                    .attr('class', d => d._children ? 'has-children' : '')
                    .style('fill', d => d._children ? "lightsteelblue" : "#fff");

                // Change the badge circle color dynamically
                nodeUpdate.select('.children-badge circle')
                    .style('fill', d => d._children ? "#ea5050" : "#95a5a6"); // Red if collapsed, Gray if expanded

                const nodeExit = node.exit().transition()
                    .duration(duration)
                    .attr('transform', d => {
                        if (isMobile()) {
                            // Adjustments for mobile view
                            return `translate(${source.x + initialHorizontalForMobile},${source.y + initialVerticalOffset})`;

                        } else {
                            // Adjustments for desktop view
                            return `translate(${source.x + initialHorizontalOffset},${source.y + initialVerticalOffset})`;


                        }
                    })
                    .remove();

                nodeExit.select('rect')
                    .attr('width', 100)
                    .attr('height', 30)
                    .attr('x', -50)
                    .attr('y', -15)
                    .attr('rx', 10)
                    .attr('ry', 10);

                const link = svgGroup.selectAll('path.link')
                    .data(links, d => d.id);

                const linkEnter = link.enter().insert('path', 'g')
                    .attr('class', 'link')
                    .attr('d', d => {
                        const o = { x: source.x, y: source.y };
                        if (isMobile()) {
                            // Adjustments for mobile view
                            return `M${o.x + initialHorizontalForMobile},${o.y + initialVerticalOffset}V${o.y + initialVerticalOffset}H${d.x + initialHorizontalForMobile}V${d.y + initialVerticalOffset}`;

                        } else {
                            // Adjustments for desktop view
                            return `M${o.x + initialHorizontalOffset},${o.y + initialVerticalOffset}V${o.y + initialVerticalOffset}H${d.x + initialHorizontalOffset}V${d.y + initialVerticalOffset}`;


                        }
                    });

                const linkUpdate = linkEnter.merge(link);

                linkUpdate.transition()
                    .duration(duration)
                    .attr('d', d => {
                        if (isMobile()) {
                            // Adjustments for mobile view
                            return `M${d.parent.x + initialHorizontalForMobile},${d.parent.y + initialVerticalOffset}V${d.parent.y + 45 + initialVerticalOffset}H${d.x + initialHorizontalForMobile}V${d.y + initialVerticalOffset}`;


                        } else {
                            // Adjustments for desktop view
                            return `M${d.parent.x + initialHorizontalOffset},${d.parent.y + initialVerticalOffset}V${d.parent.y + 45 + initialVerticalOffset}H${d.x + initialHorizontalOffset}V${d.y + initialVerticalOffset}`;
                        }
                    });
                const linkExit = link.exit()
                    .attr('d', d => {
                        const o = { x: source.x, y: source.y };
                        if (isMobile()) {
                            // Adjustments for mobile view
                            return `M${o.x + initialHorizontalForMobile},${o.y + initialVerticalOffset}V${o.y}H${d.x}V${d.y + initialVerticalOffset}`;

                        } else {
                            // Adjustments for desktop view
                            return `M${o.x + initialHorizontalOffset},${o.y + initialVerticalOffset}V${o.y}H${d.x}V${d.y + initialVerticalOffset}`;


                        }
                    })
                    .remove();

                nodes.forEach(d => {
                    d.x0 = d.x;
                    d.y0 = d.y;
                });

                if (center) {
                    centerTopNode();
                }
            }

            function click(event, d) {
                let hasChanges = false;

                if (d.children) {
                    d._children = d.children.concat(d._children || []);
                    d.children = null;
                    hasChanges = true;
                } else {
                    if (d._children) {
                        d.children = d._children;
                        d._children = null;
                        hasChanges = true;

                        d.children.forEach(child => {
                            if (child.children) {
                                child._children = child.children;
                                child.children = null;
                            }
                        });
                    }
                }

                if (hasChanges) {
                    // 1. Calculate the absolute X/Y of the clicked node BEFORE the layout updates
                    const horizontalOffset = isMobile() ? initialHorizontalForMobile : initialHorizontalOffset;
                    const oldX = (currentAdjustment + d.x0 + horizontalOffset) * zoomLevel;
                    const oldY = (230 + d.y0 + initialVerticalOffset) * zoomLevel;

                    update(d); // Triggers D3 to calculate the new tree shape

                    // 2. Calculate the absolute X/Y of the clicked node AFTER the layout updates
                    const newX = (currentAdjustment + d.x + horizontalOffset) * zoomLevel;
                    const newY = (230 + d.y + initialVerticalOffset) * zoomLevel;

                    // 3. Scroll the container by the exact difference to keep the node perfectly stationary
                    const treeContainer = document.getElementById('tree-container');
                    treeContainer.scrollLeft += (newX - oldX);
                    treeContainer.scrollTop += (newY - oldY);
                }
            }

            // Handle clicks from search results
            function focusOnNodeFromSearch(fullName) {
                console.log('Find the node corresponding to the fullName:', fullName);

                // Split the fullName to traverse the tree hierarchy
                const nameParts = fullName.split(' بن ').reverse();
                let currentNode = root;
                let pathNodes = [root]; // Track the path from root to the target node

                console.log('nameParts:', nameParts);
                let counter = 1; // Initialize the counter

                // Traverse the tree according to nameParts
                for (let part of nameParts) {

                    // Check if the length of nameParts is 1
                    if (nameParts.length === 1) {
                        console.log('Single name in nameParts:', nameParts[0]);
                        console.log('The searched name matches the root node');
                        // Center the root node
                        centerNode(currentNode);
                        return;

                    }
                    console.log(`Current node: ${currentNode.data.name}, looking for child: ${nameParts[counter]}`);

                    // Check if currentNode has children
                    if (!currentNode.children || currentNode.children.length === 0) {
                        console.log('No children found for:', currentNode.data.name);
                        // Try to expand the node to load children
                        if (currentNode._children) {
                            currentNode.children = currentNode._children;
                            currentNode._children = null; // Mark them as expanded
                            update(root);
                            console.log('Expanded node:', currentNode.data.name);
                        } else {
                            return; // No children and no _children to expand
                        }
                    }

                    // Find the child whose name matches the current part
                    let matchingChild = currentNode.children.find(child => child.data.name === nameParts[counter]);

                    // Log and return if no matching child is found
                    if (!matchingChild) {
                        console.log('No matching node found for part:', part);
                        return;
                    }

                    // Update currentNode to the found child
                    currentNode = matchingChild;
                    pathNodes.push(currentNode); // Add current node to path
                    counter++;

                    // If this is the last part, stop expanding
                    if (counter === nameParts.length) {
                        console.log('Reached the last element in nameParts, will not expand this node:', currentNode.data.name);
                        break;
                    }
                    expandNode(currentNode);
                    update(root);

                }

                // Expand all nodes along the path to the target node
                //pathNodes.forEach(node => expandNode(node));

                // Update the tree to reflect the changes
                //update(root);

                // Center on the found node
                console.log('Centering on node:', currentNode.data.name);
                setTimeout(() => {
                    console.log('Centering on node:', currentNode.data.name);
                    centerNode(currentNode);
                }, delay); // Adjust the delay as needed                
            }

            // Expand a single node
            function expandNode(node) {
                if (!node.children && node._children) {
                    node.children = node._children; // Expand the children
                    node._children = null; // Mark them as expanded
                    console.log('Expanded node:', node.data.name);
                }
            }


            function isTreeFullyExpanded(node) {
                // If the node has _children, it's not fully expanded
                if (node._children) return false;

                // Recursively check children
                if (node.children) {
                    for (let child of node.children) {
                        if (!isTreeFullyExpanded(child)) return false;
                    }
                }

                // If no _children are found, it's fully expanded
                return true;
            }

            function centerNode(source) {
                const nodeElement = d3.select(`[data-id='${source.id}']`);
                const rectElement = nodeElement.select('rect').node(); // Select <rect> by data-id
                const textElement = nodeElement.select('text').node(); // Select <text> by data-id
                const treeContainer = document.getElementById('tree-container');

                if (rectElement && textElement && treeContainer) {

                    // Scroll the node into view
                    nodeElement.node().scrollIntoView({ behavior: 'auto', block: 'center', inline: 'center' });

                    // Temporarily add the highlight class to the rect and text elements
                    rectElement.classList.add('highlight');
                    textElement.classList.add('highlight');

                    // Remove the highlight class after a delay
                    setTimeout(() => {
                        rectElement.classList.remove('highlight');
                        textElement.classList.remove('highlight');

                    }, firstHighlightDelay); // Adjust delay as necessary (2000ms = 2 seconds)

                    setTimeout(() => {
                        rectElement.classList.add('highlight');
                        textElement.classList.add('highlight');

                    }, firstHighlightDelay * 2); // Adjust delay as necessary (2000ms = 2 seconds)

                    // Remove the highlight class after a delay
                    setTimeout(() => {
                        rectElement.classList.remove('highlight');
                        textElement.classList.remove('highlight');

                    }, firstHighlightDelay * 3); // Adjust delay as necessary (2000ms = 2 seconds)

                    setTimeout(() => {
                        rectElement.classList.add('highlight');
                        textElement.classList.add('highlight');

                    }, firstHighlightDelay * 4); // Adjust delay as necessary (2000ms = 2 seconds)

                    // Remove the highlight class after a delay
                    setTimeout(() => {
                        rectElement.classList.remove('highlight');
                        textElement.classList.remove('highlight');

                    }, firstHighlightDelay * 5); // Adjust delay as necessary (2000ms = 2 seconds)


                }
            }


            function displaySearchResults(query) {
                const searchResults = document.getElementById('search-results');
                searchResults.innerHTML = '';
                if (query.length < 1) {
                    searchResults.style.display = 'none';
                    return;
                }
                const matchedNames = searchTreeNames(data, query);

                // Add the index to the loop
                matchedNames.forEach((fullName, index) => {
                    const li = document.createElement('li');

                    // Format the output to include the number: "1- الاسم"
                    li.innerText = `${index + 1}- ${fullName}`;

                    li.addEventListener('click', function () {
                        // Keep using the original fullName for the search logic!
                        focusOnNodeFromSearch(fullName);
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(li);
                });
                searchResults.style.display = matchedNames.length ? 'block' : 'none';
            }

            function searchTreeNames(node, query, fullName = "", matches = []) {
                const currentFullName = fullName ? `${node.name} بن ${fullName}` : node.name;
                if (currentFullName.toLowerCase().startsWith(query)) {
                    matches.push(currentFullName);
                }
                if (node.children) {
                    node.children.forEach(child => searchTreeNames(child, query, currentFullName, matches));
                }
                return matches;
            }

            function centerTopNode() {
                const topNode = d3.select('.node').node();
                const treeContainer = document.getElementById('tree-container');
                if (topNode && treeContainer) {
                    const topNodeBox = topNode.getBoundingClientRect();
                    const containerBox = treeContainer.getBoundingClientRect();

                    // Use += to adjust current scroll relative to the screen difference
                    treeContainer.scrollLeft += (topNodeBox.left - containerBox.left) - (containerBox.width / 2) + (topNodeBox.width / 2);
                    treeContainer.scrollTop += (topNodeBox.top - containerBox.top) - (containerBox.height / 2) + (topNodeBox.height / 2);
                }
            }

            function toggleTree() {
                // Temporarily store the original duration (50) and set it to 0 for instant rendering
                let originalDuration = duration;
                duration = 0;

                if (root.children) {
                    collapseAll(root);
                } else {
                    expandAll(root);
                }

                update(root);
                centerTopNode();

                // Restore the original duration so single clicks stay smooth
                duration = originalDuration;
            }

            function collapseAll(d) {
                if (d.children) {
                    d.children.forEach(collapseAll);
                    d._children = d.children;
                    d.children = null;
                }
            }

            function expandAll(d) {
                if (d._children) {
                    d.children = d._children;
                    d.children.forEach(expandAll);
                    d._children = null;
                }
            }

            function zoomIn() {
                zoomLevel = Math.min(zoomLevel + 0.1, 1);
                update(root, true);
                centerTopNode();
            }

            function zoomOut() {
                zoomLevel = Math.max(zoomLevel - 0.1, 0.2);
                update(root, true);
                centerTopNode();
            }

            document.addEventListener('DOMContentLoaded', function () {
                document.getElementById('view-stats-btn').addEventListener('click', function () {
                    location.href = 'statistics.html';
                });
            });

            document.addEventListener('DOMContentLoaded', function () {
                document.getElementById('search-box').addEventListener('input', function () {
                    const query = this.value.toLowerCase();
                    displaySearchResults(query);
                });

                document.addEventListener('click', function (event) {
                    if (!document.getElementById('search-box').contains(event.target)) {
                        document.getElementById('search-results').style.display = 'none';
                    }
                });
            });

            document.getElementById('expand-collapse-btn').addEventListener('click', toggleTree);
            document.getElementById('zoom-in-btn').addEventListener('click', zoomIn);
            document.getElementById('zoom-out-btn').addEventListener('click', zoomOut);

            update(root);

            // --- كود الإخفاء التلقائي للشعار ---
// --- كود الإخفاء التدريجي (الذكي والمتزامن مع الشجرة) ---
const topHeader = document.querySelector('.top-header');

// قراءة الارتفاع الفعلي للشعار تلقائياً لتجنب قصه (المشكلة الأولى)
let maxHeaderHeight = topHeader.offsetHeight;
if (maxHeaderHeight < 150) maxHeaderHeight = 350; // قيمة احتياطية

let currentScroll = 0; 
let lastTouchY = 0;

// دالة تتحقق مما إذا كانت الشجرة في أعلى نقطة لها (المشكلة الثانية)
function isTreeAtTop() {
    const svg = document.querySelector('#tree-container svg');
    const g = svg ? svg.querySelector('g') : null;
    if (!svg || !g) return true;
    
    const svgRect = svg.getBoundingClientRect();
    const gRect = g.getBoundingClientRect();
    
    // نتحقق إذا كان أعلى جزء من الشجرة مرئياً داخل الشاشة
    // وضعنا -30 بكسل لتوفير مرونة وتجنب التعليق بسبب الهوامش
    return gRect.top >= (svgRect.top - 30); 
}

function updateHeaderAppearance() {
    let percentage = 1 - (currentScroll / maxHeaderHeight);
    
    topHeader.style.opacity = Math.max(0, percentage);
    topHeader.style.maxHeight = Math.max(0, maxHeaderHeight * percentage) + 'px';
    topHeader.style.paddingTop = Math.max(0, 15 * percentage) + 'px';
    topHeader.style.paddingBottom = Math.max(0, 15 * percentage) + 'px';
    
    if (percentage <= 0) {
        topHeader.style.borderBottom = 'none';
    } else {
        topHeader.style.borderBottom = '1px solid rgba(139, 115, 85, 0.3)';
    }
}

// قلب الخوارزمية: توجيه الحركة إما للشعار أو للشجرة
function handleScroll(delta) {
    if (delta > 0) { 
        // المستخدم يسحب لأسفل (النزول في الصفحة - إخفاء الشعار)
        if (currentScroll < maxHeaderHeight) {
            currentScroll += delta;
            if (currentScroll > maxHeaderHeight) currentScroll = maxHeaderHeight;
            updateHeaderAppearance();
            return true; // نوقف الشجرة حتى يختفي الشعار بالكامل
        }
        return false; // الشعار اختفى، اسمح للشجرة بالحركة بحرية
        
    } else if (delta < 0) { 
        // المستخدم يسحب لأعلى (الصعود في الصفحة - إظهار الشعار)
        if (isTreeAtTop()) {
            if (currentScroll > 0) {
                currentScroll += delta;
                if (currentScroll < 0) currentScroll = 0;
                updateHeaderAppearance();
                return true; // نوقف الشجرة ليظهر الشعار
            }
            return false; // الشعار ظاهر بالكامل، اسمح بسحب الشجرة لأسفل أكثر
        }
        return false; // الشجرة لم تصل للقمة بعد، اسمح لها بالصعود أولاً
    }
    return false;
}

// 1. التقاط عجلة الماوس
window.addEventListener('wheel', function(event) {
    let absorbed = handleScroll(event.deltaY * 0.8);
    if (absorbed) {
        event.preventDefault(); // إيقاف التمرير الافتراضي
        event.stopPropagation(); // إيقاف حركة D3 الخاصة بالشجرة
    }
}, { passive: false, capture: true });

// 2. التقاط اللمس للجوالات
window.addEventListener('touchstart', function(event) {
    lastTouchY = event.touches[0].clientY;
    // تحديث ارتفاع الشعار إذا لزم الأمر
    if (currentScroll === 0) {
        maxHeaderHeight = Math.max(topHeader.offsetHeight, 350);
    }
}, { passive: true });

window.addEventListener('touchmove', function(event) {
    let currentY = event.touches[0].clientY;
    let deltaY = lastTouchY - currentY; // قياس مسافة السحب
    
    let absorbed = handleScroll(deltaY * 1.2); 
    if (absorbed) {
        event.preventDefault();
        event.stopPropagation();
    }
    lastTouchY = currentY;
}, { passive: false, capture: true });

// 3. التقاط السحب بزر الماوس
window.addEventListener('pointermove', function(event) {
    if (event.buttons === 1) { 
        let deltaY = -event.movementY;
        let absorbed = handleScroll(deltaY);
        if (absorbed) {
            event.preventDefault();
            event.stopPropagation();
        }
    }
}, { passive: false, capture: true });
// ---------------------------------------------------

        </script>
