<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <link rel="preload" as="image" href="logo.png">
    <link rel="preload" as="image" href="verse.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسرة السياط</title>
    <meta name="description" content="شجرة أسرة السياط — من عشيرة أهل الحجلا من الزقاريط من عبدة من قبيلة شمر الطائية">
    <link rel="icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon_io/favicon-32x32.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi+Ink:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        .intro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .logo-intro, .verse-img, .enter-btn {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .logo-intro {
            display: block;
            width: 80vw;
            max-width: 450px;
            height: auto;
        }

        .verse-img {
            display: block;
            width: 80vw;
            max-width: 500px;
            height: auto;
        }

        .enter-btn {
            font-family: var(--font-heading);
            font-weight: 700;
            background-color: var(--color-dark);
            color: var(--color-cream);
            border: none;
            padding: 15px 50px;
            font-size: 1.3rem;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            margin-top: 10px;
        }

        .enter-btn:hover {
            background-color: #5d4a3f;
            transform: scale(1.05);
        }

        body.loaded .logo-intro {
            opacity: 1;
            transform: translateY(0);
        }

        body.loaded .verse-img {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.5s;
        }

        body.loaded .enter-btn {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 1.0s;
        }
    </style>
</head>

<body class="intro-page">
    <div class="intro-container">
        <img src="logo.png" alt="شعار أسرة السياط" class="logo-intro">
        <img src="verse.png" alt="آية قرآنية" class="verse-img">
        <a href="tree.html" class="enter-btn">دخول</a>
    </div>

    <script>
        window.addEventListener('load', function () {
            document.body.classList.add('loaded');
        });
    </script>
</body>

</html>
