<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إحصائيات شجرة أسرة السياط</title>
    <link rel="icon" href="/favicon_io/favicon.ico" type="image/x-icon">

    <!-- For .png format -->
    <link rel="icon" href="/favicon_io/favicon-32x32.png" type="image/png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap');

        body {
            font-family: 'Noto Naskh Arabic', sans-serif;
            direction: rtl; /* Set the text direction to right-to-left */
        }
        .container {
            width: 30%;
            margin: 0 auto;
        }

        .back-button {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    background-color: #ea5050;
    color: white;
    text-align: center;
    border-radius: 5px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    width: fit-content;
}

.back-button:hover {
    background-color: rgb(144, 20, 20);
}

        
        @media only screen and (max-width: 600px) {
            .container {
                width: 90%; /* Adjust the width for mobile devices */
            }
        }

        h2 {
            text-align: center;
            direction: ltr; /* Set the text direction to left-to-right */
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        .top-names li {
            background: #f4f4f4;
            margin: 5px 0;
            padding: 10px;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
        }
        .top-children li {
            background: #f4f4f4;
            margin: 5px 0;
            padding: 10px;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column; /* To make children elements stack vertically */
        }
        .name {
            flex: 1;
            text-align: right;
        }
        .top-children .name {
            margin-bottom: 15px; /* Add margin between names only for top-children list */
        }
        .count {
            flex: 0.5;
            text-align: left;
            margin-bottom: 0px; /* Add more space between count and names */
        }
        .total-members {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px; /* Adjust font size here */
            font-weight: bold; /* Add bold styling */
            color: #333; /* Change text color */
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">العودة إلى الشجرة</a> <!-- Back button -->

    <div class="container">
        <div class="total-members" id="total-members"></div>
        <h2>أكثر الأسماء تكراراً</h2>
        <ul id="top-names" class="top-names"></ul>

         <h2>ًأكثر الأفراد أبناء</h2>
        <ul id="top-children" class="top-children"></ul>
    </div>

    <script type="module">
        import data from './alseyat.js';

        function prepareStatistics(flatData) {
            const nameCounts = {};
            let totalMembers = flatData.length;

            flatData.forEach(member => {
                // Count how many times each name appears
                if (nameCounts[member.name]) {
                    nameCounts[member.name]++;
                } else {
                    nameCounts[member.name] = 1;
                }
            });

            // Sort names by frequency
            const topNames = Object.entries(nameCounts)
                .sort((a, b) => b[1] - a[1]);

            return { topNames, totalMembers };
        }

        function displayStatistics(statistics) {
            const { topNames, totalMembers } = statistics;

            document.getElementById('total-members').innerText = `إجمالي عدد أفراد الأسرة: ${totalMembers}`;

            const topNamesList = document.getElementById('top-names');
            topNames.forEach(([name, count]) => {
                const li = document.createElement('li');
                li.innerHTML = `<div class="name">${name}</div><div class="count">${count}</div>`;
                topNamesList.appendChild(li);
            });
        }

        const statistics = prepareStatistics(data);
        displayStatistics(statistics);
    </script>
</body>
</html>
